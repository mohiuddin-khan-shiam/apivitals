id: open-meteo
name: Open-Meteo Weather Forecast
description: High-resolution open-source weather forecast API without required API keys.
category: Weather & Climate
homepage: https://open-meteo.com
documentation: https://open-meteo.com/en/docs
auth: none
https: true
cors: true
endpoints:
  - name: Current Weather Berlin
    path: https://api.open-meteo.com/v1/forecast?latitude=52.52&longitude=13.41&current_weather=true
    method: GET
    expected_status: 200
    expected_content_type: json
tags:
  - weather
  - forecast
  - meteorology
  - climate
license: CC-BY-4.0
rate_limit: 10,000 requests/day
