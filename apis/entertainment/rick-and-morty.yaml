id: rick-and-morty
name: The Rick and Morty API
description: REST and GraphQL API based on the television show Rick and Morty.
category: Entertainment & Media
homepage: https://rickandmortyapi.com
documentation: https://rickandmortyapi.com/documentation
auth: none
https: true
cors: true
endpoints:
  - name: Character Rick Sanchez
    path: https://rickandmortyapi.com/api/character/1
    method: GET
    expected_status: 200
    expected_content_type: json
tags:
  - animation
  - entertainment
  - pop-culture
license: BSD-3-Clause
rate_limit: 10,000 requests/day
