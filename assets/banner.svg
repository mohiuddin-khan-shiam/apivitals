<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#a7f3d0" />
    </linearGradient>
    <linearGradient id="pulseLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.2" />
      <stop offset="35%" stop-color="#38bdf8" />
      <stop offset="65%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with subtle border -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2" />

  <!-- Subtle grid lines -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.4">
    <line x1="0" y1="90" x2="1200" y2="90" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="270" x2="1200" y2="270" />
    <line x1="240" y1="0" x2="240" y2="360" />
    <line x1="480" y1="0" x2="480" y2="360" />
    <line x1="720" y1="0" x2="720" y2="360" />
    <line x1="960" y1="0" x2="960" y2="360" />
  </g>

  <!-- Left Icon Mark -->
  <g transform="translate(80, 80)">
    <rect width="100" height="100" rx="24" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <!-- Braces -->
    <path d="M 28 32 C 22 32 22 42 22 45 C 22 47 18 50 16 50 C 18 50 22 53 22 55 C 22 58 22 68 28 68" 
          fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 72 32 C 78 32 78 42 78 45 C 78 47 82 50 84 50 C 82 50 78 53 78 55 C 78 58 78 68 72 68" 
          fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" />
    <!-- Pulse -->
    <path d="M 24 50 L 36 50 L 42 40 L 48 62 L 55 30 L 62 70 L 67 48 L 71 50 L 76 50" 
          fill="none" stroke="url(#textGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Title & Typography -->
  <text x="210" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="56" font-weight="800" fill="url(#textGrad)" letter-spacing="-1">ApiVitals</text>

  <text x="212" y="185" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#94a3b8">The Living Health Radar &amp; Latency Benchmark for Free Public APIs</text>

  <!-- Feature Pills -->
  <g transform="translate(212, 220)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="170" height="34" rx="17" fill="#0c4a6e" fill-opacity="0.5" stroke="#0284c7" stroke-width="1" />
    <circle cx="16" cy="17" r="4" fill="#38bdf8" />
    <text x="28" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#bae6fd">Daily Health Probes</text>

    <!-- Pill 2 -->
    <rect x="185" y="0" width="160" height="34" rx="17" fill="#064e3b" fill-opacity="0.5" stroke="#059669" stroke-width="1" />
    <circle cx="201" cy="17" r="4" fill="#34d399" />
    <text x="213" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#a7f3d0">Latency &amp; Uptime</text>

    <!-- Pill 3 -->
    <rect x="360" y="0" width="160" height="34" rx="17" fill="#312e81" fill-opacity="0.5" stroke="#4f46e5" stroke-width="1" />
    <circle cx="376" cy="17" r="4" fill="#818cf8" />
    <text x="388" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#c7d2fe">CORS &amp; SSL Verified</text>

    <!-- Pill 4 -->
    <rect x="535" y="0" width="145" height="34" rx="17" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <circle cx="551" cy="17" r="4" fill="#cbd5e1" />
    <text x="563" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">CLI &amp; JSON/SQLite</text>
  </g>

  <!-- Background decorative pulse wave spanning bottom -->
  <path d="M 0 310 L 300 310 L 350 310 L 400 280 L 440 340 L 480 240 L 520 350 L 560 290 L 600 310 L 1200 310" 
        fill="none" stroke="url(#pulseLine)" stroke-width="3" filter="url(#glow)" />
</svg>
