[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "apivitals"
version = "0.1.0"
description = "The living health radar, latency benchmark, and curated directory of free public APIs."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "ApiVitals Maintainers" }
]
keywords = [
    "public-apis",
    "api",
    "monitoring",
    "developer-tools",
    "uptime",
    "latency-benchmark",
    "datasets",
    "python-cli"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "rich>=13.7.0",
    "click>=8.1.7",
    "jinja2>=3.1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "types-PyYAML>=6.0.12",
]

[project.scripts]
apivitals = "apivitals.cli:main"

[project.urls]
Homepage = "https://github.com/mohiuddin-khan-shiam/apivitals"
Documentation = "https://github.com/mohiuddin-khan-shiam/apivitals#readme"
Issues = "https://github.com/mohiuddin-khan-shiam/apivitals/issues"
Repository = "https://github.com/mohiuddin-khan-shiam/apivitals"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
markers = [
    "network: marks tests that require live internet access",
]

[tool.mypy]
python_version = "3.10"
strict = false
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
