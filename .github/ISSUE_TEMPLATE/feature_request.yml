name: 💡 Feature Request
description: Propose an idea or improvement for ApiVitals.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: We appreciate suggestions for improving ApiVitals!
  - type: textarea
    id: problem
    attributes:
      label: Problem or Motivation
      description: Is your feature request related to a problem? Please describe.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like to see implemented.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or features you've considered.
