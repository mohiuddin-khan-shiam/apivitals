name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }} - Py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv package manager
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run code formatting and linter check (Ruff)
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Run static type analysis (Mypy)
        run: uv run mypy apivitals tests

      - name: Validate curated API catalog schemas
        run: uv run apivitals validate

      - name: Run automated test suite (Pytest)
        run: uv run pytest -m "not network"

      - name: Build distribution package wheel
        run: uv build
