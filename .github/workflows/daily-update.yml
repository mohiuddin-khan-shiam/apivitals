name: Daily API Health & Benchmark Update

on:
  schedule:
    # Runs daily at 03:17 UTC (off-peak, non-round minute to avoid scheduler congestion)
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: daily-update
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  update-vitals:
    name: Probe APIs & Refresh Datasets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONIOENCODING: "utf-8"
      PYTHONUTF8: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv package manager
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run automated health probes and update pipeline
        run: uv run apivitals update

      - name: Validate dataset schemas and outputs
        run: |
          uv run apivitals validate
          uv run pytest -m "not network"

      - name: Commit and push changes if updated
        id: git-commit
        env:
          GIT_AUTHOR_NAME: ${{ vars.GIT_AUTHOR_NAME }}
          GIT_AUTHOR_EMAIL: ${{ vars.GIT_AUTHOR_EMAIL }}
        run: |
          # Check for changes in data, site, or status documents
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes detected. Network vitals are up to date."
            echo "changed=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Set commit identity using repository variables with bot fallback
          NAME="${GIT_AUTHOR_NAME:-github-actions[bot]}"
          EMAIL="${GIT_AUTHOR_EMAIL:-github-actions[bot]@users.noreply.github.com}"
          git config user.name "$NAME"
          git config user.email "$EMAIL"

          TODAY=$(date -u +'%Y-%m-%d')
          git add data/ STATUS.md README.md site/

          git commit -m "data: update API health vitals and benchmarks ($TODAY)"
          git push origin main
          echo "changed=true" >> $GITHUB_OUTPUT

      - name: Report failure if pipeline errors
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "🚨 Daily Health Probe Pipeline Failed: $(date -u +'%Y-%m-%d')" \
            --body "The automated daily update workflow encountered a failure during execution. Check the run logs at: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --label "automated-failure,bug" || true
